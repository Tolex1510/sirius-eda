// Контракт микросервиса доставки: единственный источник правды для монолита и сервиса.
// Код генерируется командой scripts/gen_proto.sh, руками сгенерированные файлы не правятся.
//
// Кто вызывает: в метаданных authorization: Bearer <внутренний JWT пользователя>.
// Ошибки: NOT_FOUND, PERMISSION_DENIED, FAILED_PRECONDITION (бизнес-правило), UNAUTHENTICATED.
syntax = "proto3";

package delivery;

import "google/protobuf/timestamp.proto";

service DeliveryService {
  // Назначение курьера на оплаченный заказ.
  rpc AssignCourier(AssignCourierRequest) returns (AssignCourierResponse);

  // Курьер забрал заказ на кухне: in_progress -> on_the_way.
  rpc PickUpOrder(PickUpOrderRequest) returns (Delivery);

  // Курьер передал заказ: доставка completed, заказ delivered.
  rpc CompleteDelivery(CompleteDeliveryRequest) returns (CompleteDeliveryResponse);

  rpc GetDelivery(GetDeliveryRequest) returns (Delivery);

  // Курьер видит свои доставки, студент доставки своих заказов.
  rpc ListMyDeliveries(ListMyDeliveriesRequest) returns (ListMyDeliveriesResponse);

  // Server Streaming: текущий статус, затем каждое изменение до завершения доставки.
  rpc TrackDelivery(TrackDeliveryRequest) returns (stream DeliveryStatus);

  // Bidirectional Streaming: чат заказчика и курьера по одной доставке.
  // Первое сообщение выбирает доставку, текст в нём может быть пустым.
  rpc ChatWithCourier(stream ChatMessage) returns (stream ChatMessage);
}

message Delivery {
  int32 id = 1;
  int32 order_id = 2;
  // Пусто, пока курьер не назначен.
  optional int32 courier_id = 3;
  string status = 4;
}

message AssignCourierRequest {
  int32 order_id = 1;
  int32 courier_id = 2;
}

message AssignCourierResponse {
  int32 delivery_id = 1;
  string status = 2;
}

message PickUpOrderRequest {
  int32 delivery_id = 1;
}

message CompleteDeliveryRequest {
  int32 delivery_id = 1;
}

message CompleteDeliveryResponse {
  string status = 1;
}

message GetDeliveryRequest {
  int32 delivery_id = 1;
}

message ListMyDeliveriesRequest {}

message ListMyDeliveriesResponse {
  repeated Delivery deliveries = 1;
}

message TrackDeliveryRequest {
  int32 delivery_id = 1;
}

message DeliveryStatus {
  Delivery delivery = 1;
  google.protobuf.Timestamp changed_at = 2;
}

message ChatMessage {
  int32 delivery_id = 1;
  string text = 2;
  // Заполняет сервер: клиент не может выдать себя за другого.
  int32 author_id = 3;
  string author_role = 4;
  google.protobuf.Timestamp sent_at = 5;
}
