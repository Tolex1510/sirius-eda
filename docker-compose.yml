x-app: &app
  build: .
  image: sirius-food-app:local
  env_file: .env
  environment: &environment
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
    DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672/
    DELIVERY_GRPC_TARGET: delivery:50051
    DELIVERY_GRPC_BIND: 0.0.0.0:50051
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    REPOSITORY_BACKEND: postgres
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_food"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    hostname: rabbitmq
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus return_per_object_metrics true"
    volumes:
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m deploy.seed"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
    restart: unless-stopped

  storefront:
    build: ./storefront
    environment:
      API_INTERNAL_URL: http://api:8000
      SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      CABINET_URL: ""
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/menu-csr').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  delivery:
    <<: *app
    command: ["python", "-m", "delivery_service"]
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  outbox:
    <<: *app
    command: ["python", "-m", "app.workers.outbox_relay"]

  kitchen:
    <<: *app
    command: ["python", "-m", "app.workers.kitchen_consumer"]

  dispatch:
    <<: *app
    command: ["python", "-m", "delivery_service.worker"]

  orders:
    <<: *app
    command: ["python", "-m", "app.workers.orders_consumer"]

  payments:
    <<: *app
    command: ["python", "-m", "app.workers.payments_consumer"]

  worker:
    <<: *app
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2"]

  beat:
    <<: *app
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/sirius-celerybeat"]

  ollama-remote:
    build:
      context: ./deploy
      dockerfile: Dockerfile.ollama-remote
    profiles: ["remote-ai"]
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent
      OLLAMA_SSH_HOST: ${OLLAMA_SSH_HOST:-100.84.145.91}
      OLLAMA_SSH_USER: ${OLLAMA_SSH_USER:-tolex}
    volumes:
      - ${OLLAMA_SSH_AGENT:-/tmp/sirius-ssh-agent.sock}:/run/ssh-agent:ro
      - ./.local/ollama-ssh:/run/ollama-ssh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  webhook-proxy:
    image: nginx:alpine
    profiles: ["webhooks"]
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8082}:80"
    volumes:
      - ./deploy/webhook.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  webhook-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["webhooks"]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://webhook-proxy:80"]
    depends_on:
      webhook-proxy:
        condition: service_healthy
    restart: unless-stopped

  webhook-ssh:
    build:
      context: ./deploy
      dockerfile: Dockerfile.webhook-ssh
    profiles: ["webhooks"]
    depends_on:
      webhook-proxy:
        condition: service_healthy
    restart: unless-stopped

  webhook-localtunnel:
    build:
      context: ./deploy
      dockerfile: Dockerfile.webhook-localtunnel
    profiles: ["webhooks"]
    environment:
      WEBHOOK_SUBDOMAIN: ${WEBHOOK_SUBDOMAIN:-sirius-eda-practice}
    depends_on:
      webhook-proxy:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - ${LOKI_STORAGE:-loki_data}:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_STORAGE:-prometheus_data}:/prometheus
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["monitoring"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.0
    profiles: ["monitoring"]
    user: "0:0"
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-sirius-eda}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - ${ALLOY_STORAGE:-alloy_data}:/var/lib/alloy
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-sirius-local-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/payments.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_STORAGE:-grafana_data}:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pg_data:
  ollama_data:
  loki_data:
  alloy_data:
  grafana_data:
  prometheus_data:
