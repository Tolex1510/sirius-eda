name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Тесты работают на in-memory репозиториях и fakeredis, сервисы не нужны.
      - run: pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sirius
          POSTGRES_PASSWORD: sirius
          POSTGRES_DB: sirius_food
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sirius"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sirius:sirius@localhost:5432/sirius_food
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      # Модели и миграции не должны расходиться.
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
