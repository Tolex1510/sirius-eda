name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pytest-cov
      # Быстрые тесты не поднимают сервисы; PostgreSQL/Pact проверяются отдельной job.
      - run: pytest -q --ignore=tests/integration --ignore=tests/contracts --cov=app --cov-report=xml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sirius
          POSTGRES_PASSWORD: sirius
          POSTGRES_DB: sirius_food
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sirius -d sirius_food"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sirius:sirius@localhost:5432/sirius_food
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      # Модели и миграции не должны расходиться.
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  browser:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
      DEMO_PASSWORD: ci-demo-password-only
      OLLAMA_URL: http://127.0.0.1:1
      PAYMENT_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: npm ci --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: docker compose -p sirius-ci up -d --build --wait --wait-timeout 240
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results/
      - run: docker compose -p sirius-ci logs --tail=100
        if: failure()
      - run: docker compose -p sirius-ci down
        if: always()

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACT_DO_NOT_TRACK: "true"
      SENTRY_DSN: ""
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-lab10.txt
      - run: pytest tests/integration tests/contracts -v --junitxml=docs/lab10/results/ci-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab10-integration-and-pacts
          path: |
            docs/lab10/results/ci-integration.xml
            docs/lab10/pacts/

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-lab10.txt
      - run: python scripts/lab10_mutation.py
      - run: python scripts/lab10_mutation_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab10-mutation-before-after
          path: docs/lab10/results/mutation-*
